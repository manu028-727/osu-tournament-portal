name: Approved Container Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed release version (vMAJOR.MINOR.PATCH)
        required: true
      publish:
        description: Publish after repository and license approval
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  checks:
    if: inputs.publish && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/checks.yml
  release:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: checks
    environment: release-approval
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate version
        env: { VERSION: '${{ inputs.version }}' }
        run: '[[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish consistent service versions
        env: { VERSION: '${{ inputs.version }}' }
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for target in web tools irc-gateway; do
            docker buildx build --target "$target" --tag "$image-$target:$VERSION" --tag "$image-$target:sha-$GITHUB_SHA" --push .
          done
